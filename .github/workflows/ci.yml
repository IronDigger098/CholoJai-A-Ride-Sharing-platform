name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch cancels the previous run — no point
# burning runners on a commit that is already superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.28.0'

  # Next.js phones home with anonymous build metrics unless told not to.
  # Harmless, but a CI runner is not a person who can consent, and the
  # network call is dead weight on every build.
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The rate limiter's sliding-window logic lives in a Lua script that
    # runs inside Redis. A TypeScript fake could only prove that two
    # implementations of the algorithm agree with each other, so those
    # assertions need a real server — and a suite that silently skips
    # itself reports green while testing nothing.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Until now nothing in CI had ever executed a database query or
      # replayed a migration. Every Prisma adapter was verified only by
      # hand, and the migration chain had never been applied to an empty
      # database — the one situation every real deployment starts from.
      postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_USER: cholojai
          POSTGRES_PASSWORD: cholojai_ci_password
          POSTGRES_DB: cholojai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # --frozen-lockfile: CI must fail on a stale lockfile rather than
      # silently resolving different versions than the developer tested.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Prisma client is generated code, not committed code — it is
      # derived from schema.prisma and would be a large, constantly
      # conflicting diff in version control. So a clean checkout has no
      # client, and anything importing @prisma/client fails to compile
      # until this runs.
      #
      # DATABASE_URL is a placeholder: `generate` validates that the
      # datasource URL is present and well-formed, but never connects.
      # No migration runs here and no real database is involved.
      - name: Generate Prisma client
        run: pnpm --filter @cholojai/api exec prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

      # `migrate deploy` replays every migration in order against an empty
      # database. That is a test in its own right: it proves the chain is
      # complete and correctly ordered, which running the app against an
      # incrementally-built local database never does. A missing or
      # misordered migration fails here rather than during a deploy.
      - name: Apply migrations
        run: pnpm --filter @cholojai/api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://cholojai:cholojai_ci_password@localhost:5432/cholojai_test?schema=public

      - name: Check formatting
        run: pnpm format:check

      # Build FIRST. Type-aware linting and typechecking of apps/* resolve
      # types from packages/*'s emitted .d.ts files, which only exist after
      # a build. Running lint first passes locally (stale dist/ present) and
      # fails on a clean checkout — exactly the class of bug CI must catch.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # REDIS_TEST_URL is what un-skips the Redis-backed suites. Set here
      # rather than defaulted in code, so a missing service container shows
      # up as skipped tests rather than as tests that quietly pass.
      - name: Test
        run: pnpm test
        env:
          REDIS_TEST_URL: redis://localhost:6379

      # Separate from the unit run: these truncate tables between tests and
      # must not share a worker pool with anything else. DATABASE_TEST_URL
      # is what un-skips them — a suite that silently skips when it cannot
      # reach a database is the worst possible failure mode for the only
      # tests that touch the database at all.
      - name: Integration tests
        run: pnpm test:integration
        env:
          DATABASE_TEST_URL: postgresql://cholojai:cholojai_ci_password@localhost:5432/cholojai_test?schema=public

  commitlint:
    name: Validate commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # commitlint needs the full history to range-check the PR commits.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Hooks can be bypassed with --no-verify; CI cannot.
      - name: Validate commits in this PR
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
