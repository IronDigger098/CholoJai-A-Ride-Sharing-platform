name: Release

# Tags only, never `main`. A push to `main` is a merge; a release is a
# decision somebody makes about a particular commit, and conflating the two
# means every merge becomes a version whether or not it was meant to be.
#
# Cutting a release:
#
#   git tag -a v1.2.0 -m "v1.2.0"
#   git push origin v1.2.0
#
# Deployment is not here. Vercel and Railway both watch `main` and deploy
# on merge, which is what "main is always deployable" means in practice.
# This workflow exists to *label* what was deployed — a tag and generated
# notes — so a rollback has something to name.
on:
  push:
    tags: ['v*.*.*']

permissions:
  # The default token is read-only. Creating a release needs to write to the
  # repository's contents, and nothing else — a token scoped wider than the
  # job needs is a token an injected script can do more with.
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the notes are generated by diffing against the
          # previous tag, and a shallow clone has no previous tag to find.
          fetch-depth: 0

      # A tag is just a pointer, and it can be pushed at any commit —
      # including one that never passed CI, or one on a branch that was
      # never merged. Refusing to publish a release for a commit that is
      # not an ancestor of `main` is what keeps the tag meaningful.
      - name: Refuse to release a commit that is not on main
        run: |
          git fetch origin main --depth=0
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_SHA} is not an ancestor of main."
            echo "Tag a commit that has been merged."
            exit 1
          fi

      # Notes come from Conventional Commit history, which is exactly what
      # commitlint has been enforcing since M1 — the payoff for three
      # milestones of rejected commit messages.
      - name: Create release
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
