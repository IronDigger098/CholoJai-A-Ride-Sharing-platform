name: Bug report
description: Something behaves differently from how it should
title: '[Bug]: '
labels: ['bug']

body:
  - type: markdown
    attributes:
      value: |
        A bug report is a reproduction recipe. The faster someone else can
        make it happen on their machine, the faster it gets fixed.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The actual behaviour, including any error message or request id.
      placeholder: |
        POST /api/v1/rides returned 500.
        requestId: 3f2a1b4c-5d6e-7f80-9a1b-2c3d4e5f6071
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Numbered, from a clean state. If it is not reproducible, say so — that is useful information too.
      placeholder: |
        1. pnpm docker:up
        2. pnpm --filter @cholojai/api dev
        3. curl -X POST http://localhost:4000/api/v1/rides -d '...'
    validations:
      required: true

  - type: input
    id: request-id
    attributes:
      label: Request id
      description: From the X-Request-Id header or the error body — it locates the exact logs.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API — auth
        - API — rides
        - API — drivers
        - API — admin
        - Web — marketing
        - Web — rider
        - Web — driver
        - Web — admin
        - Database / migrations
        - Tooling / CI
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS: Windows 11
        Node: v24.16.0
        Branch/commit: main @ 3f2a1b4
