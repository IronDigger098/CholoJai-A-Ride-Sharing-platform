# Dependency updates, batched weekly.
#
# Grouped rather than one PR per package: twenty individual bumps a week is
# noise that trains you to merge without looking, which is worse than not
# updating at all. One grouped PR per ecosystem gets a real review, and CI
# proves the build still passes before it merges.

version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # Patch and minor updates are routine — batch them together.
      routine:
        update-types: ['minor', 'patch']
      # Majors arrive individually: they carry breaking changes and deserve
      # to be read, not rubber-stamped alongside nine other bumps.
      nestjs:
        patterns: ['@nestjs/*']
        update-types: ['major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
